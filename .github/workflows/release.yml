name: Release desktop application

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing or new release tag to publish
        required: true
        default: v0.2.0

permissions:
  contents: write

jobs:
  macos:
    name: Build macOS universal
    runs-on: macos-14
    env:
      MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
      MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
      RELEASE_APPLE_ID: ${{ secrets.APPLE_ID }}
      RELEASE_APPLE_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      RELEASE_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Configure macOS signing
        if: ${{ env.MAC_CSC_LINK != '' }}
        env:
          CSC_LINK: ${{ env.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ env.MAC_CSC_KEY_PASSWORD }}
        run: |
          printf 'CSC_LINK=%s\n' "$CSC_LINK" >> "$GITHUB_ENV"
          printf 'CSC_KEY_PASSWORD=%s\n' "$CSC_KEY_PASSWORD" >> "$GITHUB_ENV"
      - name: Configure macOS notarization
        if: ${{ env.RELEASE_APPLE_ID != '' && env.RELEASE_APPLE_PASSWORD != '' && env.RELEASE_APPLE_TEAM_ID != '' }}
        env:
          APPLE_ID: ${{ env.RELEASE_APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ env.RELEASE_APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ env.RELEASE_APPLE_TEAM_ID }}
        run: |
          printf 'APPLE_ID=%s\n' "$APPLE_ID" >> "$GITHUB_ENV"
          printf 'APPLE_APP_SPECIFIC_PASSWORD=%s\n' "$APPLE_APP_SPECIFIC_PASSWORD" >> "$GITHUB_ENV"
          printf 'APPLE_TEAM_ID=%s\n' "$APPLE_TEAM_ID" >> "$GITHUB_ENV"
      - name: Build macOS artifacts
        run: npm run build && npx electron-builder --mac --universal --publish never
      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-macos
          if-no-files-found: error
          path: |
            release/*.dmg
            release/*.zip
            release/*.blockmap
            release/latest-mac.yml

  windows:
    name: Build Windows x64
    runs-on: windows-2022
    env:
      WINDOWS_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
      WINDOWS_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Configure Windows signing
        if: ${{ env.WINDOWS_CSC_LINK != '' }}
        env:
          CSC_LINK: ${{ env.WINDOWS_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ env.WINDOWS_CSC_KEY_PASSWORD }}
        shell: bash
        run: |
          printf 'CSC_LINK=%s\n' "$CSC_LINK" >> "$GITHUB_ENV"
          printf 'CSC_KEY_PASSWORD=%s\n' "$CSC_KEY_PASSWORD" >> "$GITHUB_ENV"
      - name: Build Windows artifacts
        run: npm run build; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }; npx electron-builder --win --x64 --publish never
      - name: Verify Windows artifacts
        shell: pwsh
        run: |
          if (-not (Get-ChildItem "release/*-setup.exe")) { throw "NSIS installer missing" }
          if (-not (Get-ChildItem "release/*-portable.exe")) { throw "Portable executable missing" }
      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-windows
          if-no-files-found: error
          path: |
            release/*.exe
            release/*.blockmap
            release/latest.yml

  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs:
      - macos
      - windows
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Verify update metadata
        shell: bash
        run: |
          test -s release/latest-mac.yml
          test -s release/latest.yml
      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        shell: bash
        run: |
          mapfile -t assets < <(find release -maxdepth 1 -type f -print | sort)
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
          else
            gh release create "$RELEASE_TAG" "${assets[@]}" \
              --title "Axiom Agent $RELEASE_TAG" \
              --generate-notes \
              --verify-tag
          fi
